<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Barbearia Martins | Testes</title><link rel="icon" href="logo.jpg" onerror="this.remove()">
<style>
:root{font-family:Arial,Helvetica,sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#09090b;color:#f4f4f5}button,input,select{font:inherit}button{cursor:pointer}header{padding:19px 18px;border-bottom:1px solid #27272a;display:flex;justify-content:space-between;align-items:center;background:#101014}header strong{letter-spacing:2px;font-size:15px}header small{display:block;color:#9ca3af;font-size:10px;margin-top:5px}.shell{max-width:750px;margin:auto;padding-bottom:100px}.hero{padding:22px 18px}.identity{display:flex;align-items:center;gap:15px}.logo,.round{background:#06283c;border-radius:50%;height:65px;width:65px;display:grid;place-items:center;color:#d5f2ff;font-size:27px;flex-shrink:0}.identity h1{font-size:23px;margin:5px 0}.identity small{color:#aaa}.badge{background:#303035;padding:4px 8px;border-radius:6px;color:#ffbc36}.cover{height:225px;border-radius:13px;background:linear-gradient(140deg,#0d4053,#111827 60%,#20252d);margin-top:23px;display:flex;align-items:end;padding:25px}.cover h2{margin:0;font-size:29px}.cover p{color:#cbd5e1}.tabs{display:flex;gap:25px;overflow:auto;padding:0 18px;border-bottom:1px solid #333;scrollbar-width:none}.tabs button{white-space:nowrap;background:none;color:#ccc;border:0;padding:18px 0}.tabs .active{color:white;border-bottom:3px solid #0784ca}.content{padding:20px 18px}h2{font-size:23px;margin:26px 0 13px}h3{margin:10px 0}.muted{color:#a1a1aa}.amenities{display:flex;justify-content:space-between;gap:12px;margin:25px 0 35px}.amenities button{background:#18181c;border:1px solid #303035;border-radius:15px;color:#aaa;font-size:23px;padding:16px;flex:1}.search{width:100%;background:#1b1b20;border:1px solid #34343b;color:white;border-radius:9px;padding:16px;margin:15px 0}.sort{display:flex;align-items:center;justify-content:end;gap:9px;color:#999;margin:22px 0}.sort button,.choice{background:#1d1d22;color:white;border:1px solid #52525b;border-radius:10px;padding:9px 13px}.choice.selected,.sort .selected{border-color:#168bd1;background:#113249}.service{display:flex;align-items:center;gap:13px;padding:21px 0;border-top:1px solid #26262a;min-height:110px}.round{width:53px;height:53px;font-size:22px}.service .info{flex:1;min-width:0}.service h3{font-size:17px;margin:0 0 16px}.details{display:flex;gap:17px;flex-wrap:wrap;font-size:14px}.price{color:#16b65d;font-weight:700}.schedule,.primary{border:0;background:#087bbd;color:white;border-radius:9px;padding:13px 15px}.schedule{font-size:15px}.primary{width:100%;padding:15px;margin-top:20px;font-weight:bold}.card{background:#1b1b20;border:1px solid #34343b;border-radius:12px;padding:17px;margin:12px 0}.staff{display:flex;gap:14px;align-items:center}.staff .round{border-radius:12px}.empty{text-align:center;padding:70px 10px;color:#b5b5ba}.line{display:flex;justify-content:space-between;gap:12px;margin:20px 0;color:#aaa}.line span:last-child{text-align:right}.pill{display:inline-block;background:#303036;padding:10px;border-radius:24px;margin:5px}.bottom{position:fixed;bottom:0;left:0;right:0;background:#09090b;border-top:1px solid #303035;display:flex;justify-content:space-around;padding:11px 0 max(13px,env(safe-area-inset-bottom))}.bottom button{background:none;border:0;color:#a1a1aa;display:flex;flex-direction:column;gap:5px;align-items:center;font-size:12px}.bottom button span:first-child{font-size:23px}.bottom .current{color:#fff}.field{display:block;margin-top:20px;font-weight:600}.field input{display:block;width:100%;background:#1b1b20;border:1px solid #484851;border-radius:9px;padding:14px;color:white;margin-top:9px}.choices{display:flex;flex-wrap:wrap;gap:9px;margin:13px 0}.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}.slots button{padding:12px 2px;background:#202027;color:white;border:1px solid #444;border-radius:8px}.slots .selected{background:#087bbd;border-color:#087bbd}.back{background:none;border:0;color:#8dcdf7;padding:10px 0}.notice{background:#143c2c;color:#c6f6dc;border-radius:9px;padding:15px}.rating{color:#ffac00;font-size:22px}.light{background:#f5f5f5;color:#141414}.light header,.light .bottom{background:white}.light .card,.light .search,.light .field input,.light .choice{background:white;color:#111}.light .service{border-color:#ddd}@media(min-width:700px){.cover{height:310px}.service{padding:25px 0}}
</style></head><body><div id="app"></div>
<script>
const services=[{name:'Corte Degrade',price:20,duration:30},{name:'Corte social',price:20,duration:30},{name:'Barba + pezinho',price:20,duration:15},{name:'Barba Desenhada',price:15,duration:30},{name:'Barba retirada',price:5,duration:15},{name:'Cavanhaque',price:7,duration:15},{name:'Corte + Barba',price:32,duration:30},{name:'Corte + Barba + Sobrancelha',price:35,duration:30},{name:'Corte + Pigmentação',price:40,duration:60},{name:'Corte + Sobrancelha',price:25,duration:30},{name:'Corte americano',price:20,duration:30},{name:'Corte Infantil',price:20,duration:30},{name:'Corte na tesoura',price:22,duration:30},{name:'Corte Navalhado',price:23,duration:30},{name:'Corte + Cavanhaque',price:27,duration:30},{name:'Hidratação',price:15,duration:45},{name:'Luzes',price:40,duration:60},{name:'Luzes especial',price:50,duration:60},{name:'Moicano',price:20,duration:30},{name:'Penteado',price:15,duration:30},{name:'Pigmentação no cabelo',price:30,duration:60},{name:'Selagem',price:60,duration:75},{name:'Sobrancelha',price:7,duration:15}],staff=['Nilber','Welio'],tabs=['Serviços','Profissionais','Fidelidade','Produtos','Pacotes','Assinaturas','Avaliações'];let tab='Serviços',nav='Início',selected=null,barber='Nilber',date='',time='',query='',sort='name',success=false,light=false;const SUPABASE_URL=""; // Cole aqui a URL do projeto Supabase
const SUPABASE_ANON_KEY=""; // Cole aqui a chave anon/publishable (NUNCA service_role)
const DB_ON=Boolean(SUPABASE_URL&&SUPABASE_ANON_KEY);
const KEY='barber_martins_html_demo';let bookings=JSON.parse(localStorage.getItem(KEY)||'[]');let remoteBusy=[];let loading=false;let lastBooking=null;
async function rpc(fn,params){const r=await fetch(SUPABASE_URL+'/rest/v1/rpc/'+fn,{method:'POST',headers:{'apikey':SUPABASE_ANON_KEY,'Authorization':'Bearer '+SUPABASE_ANON_KEY,'Content-Type':'application/json'},body:JSON.stringify(params)});const data=await r.json();if(!r.ok)throw Error(data.message||'Erro ao salvar agendamento');return data;}
async function loadBusy(){if(!DB_ON||!date)return;loading=true;render();try{remoteBusy=await rpc('public_busy_slots',{p_day:date,p_barber:barber});}catch(e){alert('Não foi possível consultar horários: '+e.message);remoteBusy=[]}finally{loading=false;render()}}
const $=id=>document.getElementById(id),fmt=n=>n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),iso=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-'),minutes=s=>Number(s.slice(0,2))*60+Number(s.slice(3)),hh=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function slots(){if(!date||!selected)return[];const day=new Date(date+'T12:00:00').getDay();if(day===0)return[];const windows=day===6?[['08:30','12:30'],['13:00','16:00']]:[['08:30','12:00'],['14:00','18:00']];let out=[];for(const [a,b] of windows){for(let m=minutes(a);m+selected.duration<=minutes(b);m+=15){let t=hh(m),past=new Date(date+'T'+t+':00').getTime()<Date.now(),busy=bookings.some(x=>x.status!=='cancelado'&&x.date===date&&x.barber===barber&&m<minutes(x.time)+x.duration&&m+selected.duration>minutes(x.time));const dbBusy=DB_ON&&remoteBusy.some(x=>m<minutes(x.slot_time.slice(0,5))+x.duration_minutes&&m+selected.duration>minutes(x.slot_time.slice(0,5)));if(!past&&!busy&&!dbBusy)out.push(t)}}return out}
function selectService(i){selected=services[i];date=iso(new Date());barber='Nilber';time='';success=false;render();if(DB_ON)loadBusy();scrollTo(0,0)}
function go(n){nav=n;selected=null;query='';render();scrollTo(0,0)}
function changeTab(t){tab=t;query='';render();setTimeout(()=>$('tabs').querySelector('.active')?.scrollIntoView({block:'nearest',inline:'center'}),0)}
function save(){localStorage.setItem(KEY,JSON.stringify(bookings))}
async function confirmBooking(e){e.preventDefault();const name=$('customer').value.trim(),phone=$('phone').value.replace(/\D/g,'');if(!name||phone.length<10||!slots().includes(time)){alert('Informe nome, telefone válido e escolha um horário disponível.');return}const btn=e.submitter;btn.disabled=true;btn.textContent='Reservando...';try{let id=Date.now();if(DB_ON){const result=await rpc('create_booking',{p_name:name,p_phone:phone,p_service:selected.name,p_price:selected.price,p_duration:selected.duration,p_barber:barber,p_day:date,p_time:time});id=result.booking_id||id;}else{bookings.push({id,name,phone,service:selected.name,price:selected.price,duration:selected.duration,barber,date,time,status:'confirmado'});save();}lastBooking={id,name,phone,service:selected.name,price:selected.price,barber,date,time};success=true;render();}catch(err){alert('Horário não reservado: '+err.message);if(DB_ON)await loadBusy();else render()}}
function whatsapp(){if(!lastBooking)return;const x=lastBooking;const message=`Olá! Fiz uma reserva na Barbearia Martins.\n\nNome: ${x.name}\nServiço: ${x.service}\nBarbeiro: ${x.barber}\nData: ${x.date.split('-').reverse().join('/')}\nHorário: ${x.time}\nValor: ${fmt(x.price)}\nCódigo: ${x.id}\n\nAgendamento realizado pelo site.`;window.open('https://wa.me/5589974007408?text='+encodeURIComponent('🧪 TESTE DO SISTEMA — NÃO É AGENDAMENTO REAL\n\n'+message),'_blank','noopener')}
function cancel(id){if(!confirm('Cancelar este agendamento demonstrativo?'))return;bookings=bookings.map(x=>x.id===id?{...x,status:'cancelado'}:x);save();render()}
function main(){if(selected)return `<section class="content"><button class="back" onclick="selected=null;render()">‹ Voltar</button>${success?`<div class="notice"><h2>✓ Agendamento registrado!</h2>Agendamento de teste: sem confirmação real da barbearia.</div><div class="card"><h3>${esc(selected.name)}</h3><p>${esc(barber)} • ${date.split('-').reverse().join('/')} às ${time}</p></div><button class="primary" onclick="whatsapp()">Enviar teste para meu WhatsApp ↗</button><button class="primary" onclick="go('Agendamentos')">Meus agendamentos</button>`:`<h1>Reserve seu horário</h1><div class="card"><b>${esc(selected.name)}</b><p class="price">${fmt(selected.price)} • ${selected.duration} min</p></div><form onsubmit="confirmBooking(event)"><label class="field">Escolha o profissional</label><div class="choices">${staff.map(s=>`<button type="button" class="choice ${barber===s?'selected':''}" onclick="barber='${s}';time='';render();if(DB_ON)loadBusy()">${s}</button>`).join('')}</div><label class="field">Selecione a data<input type="date" min="${iso(new Date())}" max="${iso(new Date(Date.now()+60*86400000))}" value="${date}" onchange="date=this.value;time='';render();if(DB_ON)loadBusy()" required></label><label class="field">Horários disponíveis</label><div class="slots">${loading?'<p class="muted">Consultando disponibilidade...</p>':slots().length?slots().map(t=>`<button type="button" class="${time===t?'selected':''}" onclick="time='${t}';render()">${t}</button>`).join(''):'<p class="muted">Nenhum horário disponível.</p>'}</div><label class="field">Seu nome<input id="customer" required placeholder="Nome completo"></label><label class="field">Telefone / WhatsApp<input id="phone" type="tel" required placeholder="(89) 99999-9999"></label><button class="primary" ${!time?'disabled':''}>Confirmar • ${fmt(selected.price)}</button></form>`}</section>`;
if(nav==='Agendamentos')return `<section class="content"><h1>Meus agendamentos</h1><p class="muted">${DB_ON?'Consulte o comprovante salvo após a reserva. Para cancelamentos, entre em contato com a barbearia.':'Somente neste navegador, para demonstração.'}</p>${bookings.length?bookings.map(x=>`<div class="card"><b>${esc(x.service)}</b><p>${x.date.split('-').reverse().join('/')} às ${x.time} • ${esc(x.barber)}</p><p>${esc(x.name)} • ${fmt(x.price)}</p><button class="choice" onclick="cancel(${x.id})" ${x.status==='cancelado'?'disabled':''}>${x.status==='cancelado'?'Cancelado':'Cancelar'}</button></div>`).join(''):'<div class="empty">Você ainda não tem agendamentos.</div>'}</section>`;
if(nav==='Perfil')return '<section class="content"><h1>Meu perfil</h1><div class="card">👤<h2>Bem-vindo!</h2><p>Versão demonstrativa sem login. Seus agendamentos ficam neste navegador.</p></div></section>';
let results=services.map((s,i)=>({...s,i})).filter(s=>s.name.toLowerCase().includes(query.toLowerCase())).sort((a,b)=>sort==='price'?a.price-b.price:a.name.localeCompare(b.name,'pt-BR'));
return `<div class="hero"><div class="identity"><div class="logo"><img src="logo.jpg" onerror="this.remove();this.parentNode.textContent='✂'" alt="Logo da barbearia" style="width:100%;height:100%;object-fit:cover;border-radius:50%"></div><div><span class="badge">⭐ 5.0</span><h1>Barbearia Martins</h1><small>Inhuma, Piauí</small></div></div><div class="cover"><div><h2>Seu estilo começa aqui.</h2><p>Ambiente de testes • agendamentos não são reais.</p></div></div></div><div class="tabs" id="tabs">${tabs.map(t=>`<button class="${tab===t?'active':''}" onclick="changeTab('${t}')">${t}</button>`).join('')}</div><section class="content"><h2>Comodidades</h2><p class="muted">Clique no item para obter informações</p><div class="amenities">${[['⌁','Wi-Fi indisponível'],['🚘','Estacionamento'],['♿','Acessibilidade não informada'],['⊘','Animais não permitidos']].map(x=>`<button onclick="alert('${x[1]}')">${x[0]}</button>`).join('')}</div><h2>${nav==='Buscar'?'Buscar serviços':tab}</h2><input class="search" placeholder="⌕  Pesquisar" value="${esc(query)}" oninput="query=this.value;updateResults()"><div id="results">${resultContent(results)}</div>${details()}</section>`}
function resultContent(results){if(tab==='Serviços'||nav==='Buscar')return `<div class="sort">Ordenar por <button class="${sort==='name'?'selected':''}" onclick="sort='name';updateResults()">Nome</button><button class="${sort==='price'?'selected':''}" onclick="sort='price';updateResults()">Valor</button></div>${results.map(s=>`<article class="service"><div class="round">✂</div><div class="info"><h3>${esc(s.name)}</h3><div class="details"><span class="price">${fmt(s.price)}</span><span>◷ ${s.duration} min</span></div></div><button class="schedule" onclick="selectService(${s.i})">Agendar</button></article>`).join('')}`;
if(tab==='Profissionais')return staff.filter(s=>s.toLowerCase().includes(query.toLowerCase())).map(s=>`<div class="card staff"><div class="round">👤</div><div><h3>${s}</h3><p class="muted">Profissional</p></div></div>`).join('');
if(tab==='Avaliações')return [['Antônio Pablo','12/09/2026',''],['Francinaldo França','30/05/2025','Atendimento top, melhor barbearia de Inhuma.'],['Arthur Borges','','']].filter(x=>x[0].toLowerCase().includes(query.toLowerCase())).map(x=>`<div class="card"><b>${x[0]}</b><p class="muted">${x[1]}</p><div class="rating">★★★★★</div><p>${x[2]}</p></div>`).join('');
return `${tab==='Fidelidade'?'<div class="choices"><span class="pill">Todos</span><span class="pill">Produtos</span><span class="pill">Serviços</span></div>':''}<div class="empty">Nenhum item encontrado</div>`}
function updateResults(){let r=services.map((s,i)=>({...s,i})).filter(s=>s.name.toLowerCase().includes(query.toLowerCase())).sort((a,b)=>sort==='price'?a.price-b.price:a.name.localeCompare(b.name,'pt-BR'));$('results').innerHTML=resultContent(r)}
function details(){return `<h2>Detalhes do estabelecimento</h2><h3>Localização</h3><p class="muted">Rua Joaquim Leal, 374 — Centro, Inhuma/PI</p><p><a style="color:#65baff" target="_blank" href="https://www.google.com/maps/search/?api=1&query=Rua+Joaquim+Leal+374+Inhuma+PI">Ver no mapa ↗</a></p><hr><h3>Horário de atendimento</h3>${['Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado','Domingo'].map((d,i)=>`<div class="line"><span>${d}</span><span>${i===6?'Fechado':i===5?'08:30 – 12:30<br>13:00 – 16:00':'08:30 – 12:00<br>14:00 – 18:00'}</span></div>`).join('')}<hr><h3>Formas de pagamento</h3>${['Dinheiro','Cartão de Crédito','Cartão de Débito','Pix'].map(x=>`<span class="pill">${x}</span>`).join('')}<hr><h3>Redes sociais</h3><p><a style="color:#65baff" href="https://wa.me/5589994037817">WhatsApp ↗</a></p><h3>Contato</h3><a style="color:#65baff" href="tel:+5589994037817">(89) 99403-7817</a></section>`}
function render(){document.body.className=light?'light':'';$('app').innerHTML=`<header><div><strong>✂ BARBER MARTINS</strong><small>ESTILO & TRADIÇÃO</small></div><button class="choice" onclick="light=!light;render()">${light?'☾':'☀'}</button></header><main class="shell">${main()}</main><div class="bottom">${[['⌂','Início'],['⌕','Buscar'],['▣','Agendamentos'],['◉','Perfil']].map(([ic,n])=>`<button class="${nav===n?'current':''}" onclick="go('${n}')"><span>${ic}</span>${n}</button>`).join('')}</div>`}
render();
</script></body></html>
