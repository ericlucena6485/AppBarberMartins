<script>
const services=[{name:'Corte Degrade',price:20,duration:30},{name:'Corte social',price:20,duration:30},{name:'Barba + pezinho',price:20,duration:15},{name:'Barba Desenhada',price:15,duration:30},{name:'Barba retirada',price:5,duration:15},{name:'Cavanhaque',price:7,duration:15},{name:'Corte + Barba',price:32,duration:30},{name:'Corte + Barba + Sobrancelha',price:35,duration:30},{name:'Corte + Pigmentação',price:40,duration:60},{name:'Corte + Sobrancelha',price:25,duration:30},{name:'Corte americano',price:20,duration:30},{name:'Corte Infantil',price:20,duration:30},{name:'Corte na tesoura',price:22,duration:30},{name:'Corte Navalhado',price:23,duration:30},{name:'Corte + Cavanhaque',price:27,duration:30},{name:'Hidratação',price:15,duration:45},{name:'Luzes',price:40,duration:60},{name:'Luzes especial',price:50,duration:60},{name:'Moicano',price:20,duration:30},{name:'Penteado',price:15,duration:30},{name:'Pigmentação no cabelo',price:30,duration:60},{name:'Selagem',price:60,duration:75},{name:'Sobrancelha',price:7,duration:15}],staff=['Nilber','Welio'],tabs=['Serviços','Profissionais','Fidelidade','Produtos','Pacotes','Assinaturas','Avaliações'];let tab='Serviços',nav='Início',selected=null,barber='Nilber',date='',time='',query='',sort='name',success=false,light=localStorage.getItem('martins_theme')==='light';const SUPABASE_URL=""; // Cole aqui a URL do projeto Supabase
const SUPABASE_ANON_KEY=""; // Cole aqui a chave anon/publishable (NUNCA service_role)
const DB_ON=Boolean(SUPABASE_URL&&SUPABASE_ANON_KEY);
const KEY='barber_martins_html_demo_v3';let bookings=JSON.parse(localStorage.getItem(KEY)||'[]');let remoteBusy=[];let loading=false;let lastBooking=null;
async function rpc(fn,params){const r=await fetch(SUPABASE_URL+'/rest/v1/rpc/'+fn,{method:'POST',headers:{'apikey':SUPABASE_ANON_KEY,'Authorization':'Bearer '+SUPABASE_ANON_KEY,'Content-Type':'application/json'},body:JSON.stringify(params)});const data=await r.json();if(!r.ok)throw Error(data.message||'Erro ao salvar agendamento');return data;}
async function loadBusy(){if(!DB_ON||!date)return;loading=true;render();try{remoteBusy=await rpc('public_busy_slots',{p_day:date,p_barber:barber});}catch(e){alert('Não foi possível consultar horários: '+e.message);remoteBusy=[]}finally{loading=false;render()}}
const $=id=>document.getElementById(id),fmt=n=>n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),iso=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-'),minutes=s=>Number(s.slice(0,2))*60+Number(s.slice(3)),hh=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function slots(){if(!date||!selected)return[];const day=new Date(date+'T12:00:00').getDay();if(day===0)return[];const windows=day===6?[['08:30','12:30'],['13:00','16:00']]:[['08:30','12:00'],['14:00','18:00']];let out=[];for(const [a,b] of windows){for(let m=minutes(a);m+selected.duration<=minutes(b);m+=15){let t=hh(m),past=new Date(date+'T'+t+':00').getTime()<Date.now(),busy=bookings.some(x=>x.status!=='cancelado'&&x.date===date&&x.barber===barber&&m<minutes(x.time)+x.duration&&m+selected.duration>minutes(x.time));const dbBusy=DB_ON&&remoteBusy.some(x=>m<minutes(x.slot_time.slice(0,5))+x.duration_minutes&&m+selected.duration>minutes(x.slot_time.slice(0,5)));if(!past&&!busy&&!dbBusy)out.push(t)}}return out}
function selectService(i){selected=services[i];date=iso(new Date());barber='Nilber';time='';success=false;render();if(DB_ON)loadBusy();scrollTo(0,0)}
function go(n){nav=n;selected=null;query='';render();scrollTo(0,0)}
function changeTab(t){tab=t;query='';render();setTimeout(()=>$('tabs').querySelector('.active')?.scrollIntoView({block:'nearest',inline:'center'}),0)}
function save(){localStorage.setItem(KEY,JSON.stringify(bookings))}
async function confirmBooking(e){e.preventDefault();const name=$('customer').value.trim(),phone=$('phone').value.replace(/\D/g,'');if(!name||phone.length<10||!slots().includes(time)){alert('Informe nome, telefone válido e escolha um horário disponível.');return}const btn=e.submitter;btn.disabled=true;btn.textContent='Reservando...';try{let id=Date.now();if(DB_ON){const result=await rpc('create_booking',{p_name:name,p_phone:phone,p_service:selected.name,p_price:selected.price,p_duration:selected.duration,p_barber:barber,p_day:date,p_time:time});id=result.booking_id||id;}else{bookings.push({id,name,phone,service:selected.name,price:selected.price,duration:selected.duration,barber,date,time,status:'confirmado'});save();}lastBooking={id,name,phone,service:selected.name,price:selected.price,barber,date,time};success=true;render();}catch(err){alert('Horário não reservado: '+err.message);if(DB_ON)await loadBusy();else render()}}
function whatsapp(){if(!lastBooking)return;const x=lastBooking;const message=`Olá! Fiz uma reserva na Barbearia Martins.\n\nNome: ${x.name}\nServiço: ${x.service}\nBarbeiro: ${x.barber}\nData: ${x.date.split('-').reverse().join('/')}\nHorário: ${x.time}\nValor: ${fmt(x.price)}\nCódigo: ${x.id}\n\nAgendamento realizado pelo site.`;window.open('https://wa.me/5589994037817?text='+encodeURIComponent(message),'_blank','noopener')}
function cancel(id){if(!confirm('Cancelar este agendamento demonstrativo?'))return;bookings=bookings.map(x=>x.id===id?{...x,status:'cancelado'}:x);save();render()}
const ICONS={scissors:'<circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M8.12 8.12 20 20M14.8 9.2 20 4 8.12 15.88"/>',house:'<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M9 21v-8h6v8"/>',search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',shield:'<path d="m12 2 9 4v6c0 5-4 9-9 10-5-1-9-5-9-10V6z"/><path d="m9 12 2 2 4-4"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',moon:'<path d="M20 15.5A8 8 0 0 1 8.5 4 8 8 0 1 0 20 15.5z"/>',instagram:'<rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><path d="M17.5 6.5h.01"/>','message-circle':'<path d="M21 11.5a8.5 8.5 0 0 1-12.4 7.5L3 21l2-5.6A8.5 8.5 0 1 1 21 11.5z"/>','arrow-right':'<path d="M5 12h14m-6-6 6 6-6 6"/>'};
function icon(name){return '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(ICONS[name]||ICONS.scissors)+'</svg>'}
let adminToken=null,adminUser=null,adminBookings=[],adminError='',adminLoading=false,adminPeriod='day',adminAnchor=iso(new Date());
async function authRequest(path,method='GET',body=null,token=adminToken){const r=await fetch(SUPABASE_URL+'/auth/v1/'+path,{method,headers:{apikey:SUPABASE_ANON_KEY,'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},...(body?{body:JSON.stringify(body)}:{})});const d=await r.json();if(!r.ok)throw Error(d.msg||d.error_description||d.message||'Falha na autenticação');return d}
async function adminLogin(e){e.preventDefault();if(!DB_ON){adminError='Configure Supabase para ativar o painel seguro.';render();return}const email=document.getElementById('adminEmail').value,password=document.getElementById('adminPass').value;adminLoading=true;adminError='';render();try{const d=await authRequest('token?grant_type=password','POST',{email,password});adminToken=d.access_token;adminUser=d.user;await adminRefresh()}catch(err){adminToken=null;adminError=err.message}finally{adminLoading=false;render()}}
async function adminRefresh(){if(!DB_ON||!adminToken)return;adminLoading=true;render();try{adminBookings=await rpcAdmin('admin_list_bookings',{});adminError=''}catch(e){adminError=e.message;adminBookings=[];if(/jwt|token/i.test(e.message))adminToken=null}finally{adminLoading=false;render()}}
async function rpcAdmin(fn,params){const r=await fetch(SUPABASE_URL+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:SUPABASE_ANON_KEY,Authorization:'Bearer '+adminToken,'Content-Type':'application/json'},body:JSON.stringify(params)});const d=await r.json();if(!r.ok)throw Error(d.message||'Acesso não autorizado');return d}
async function adminSet(id,status){if(!confirm('Atualizar o atendimento para '+status+'?'))return;try{await rpcAdmin('admin_update_booking',{p_id:id,p_status:status});await adminRefresh()}catch(e){alert(e.message)}}
function adminLogout(){adminToken=null;adminUser=null;adminBookings=[];render()}
function money(n){return fmt(Number(n)||0)}
function adminPage(){if(!DB_ON)return `<section class="content"><h1>${icon('shield')} Administração</h1><div class="card"><h3>Configuração necessária</h3><p>O painel exige Supabase Auth e permissões no banco. Não é seguro colocar uma senha fixa no HTML público do GitHub Pages.</p><p class="muted">Siga o README e execute o arquivo SQL antes de ativar.</p></div></section>`;
if(!adminToken)return `<section class="content"><h1>${icon('shield')} Área administrativa</h1><p class="muted">Acesso restrito ao proprietário e aos administradores autorizados.</p>${adminError?`<p class="error">${esc(adminError)}</p>`:''}<form class="card" onsubmit="adminLogin(event)"><label class="field">E-mail<input id="adminEmail" type="email" autocomplete="username" required placeholder="admin@exemplo.com"></label><label class="field">Senha<input id="adminPass" type="password" autocomplete="current-password" required minlength="6"></label><button class="primary" ${adminLoading?'disabled':''}>${adminLoading?'Entrando...':'Entrar no painel'}</button></form></section>`;
const today=adminAnchor,anchor=new Date(today+'T12:00:00'),dayOfWeek=(anchor.getDay()+6)%7,start=new Date(anchor);if(adminPeriod==='week')start.setDate(anchor.getDate()-dayOfWeek);if(adminPeriod==='month')start.setDate(1);const from=iso(start),to=adminPeriod==='day'?today:adminPeriod==='week'?iso(new Date(start.getTime()+6*86400000)):iso(new Date(anchor.getFullYear(),anchor.getMonth()+1,0));const subset=adminBookings.filter(x=>x.slot_day>=from&&x.slot_day<=to),done=subset.filter(x=>x.status==='concluido'),expected=subset.filter(x=>x.status==='confirmado'),sum=arr=>arr.reduce((a,x)=>a+Number(x.price||0),0);
return `<section class="content"><div class="admin-head"><div><h1>Painel da barbearia</h1><p class="muted">${esc(adminUser?.email||'Administrador')}</p></div><button class="choice" onclick="adminLogout()">Sair</button></div>${adminError?`<p class="error">${esc(adminError)}</p>`:''}<div class="choices">${[['day','Dia'],['week','Semana'],['month','Mês']].map(([k,v])=>`<button class="choice ${adminPeriod===k?'selected':''}" onclick="adminPeriod='${k}';render()">${v}</button>`).join('')}</div><label class="field">Data de referência<input type="date" value="${adminAnchor}" onchange="adminAnchor=this.value;render()"></label><p class="muted">Período: ${from.split('-').reverse().join('/')} a ${to.split('-').reverse().join('/')}</p><div class="kpis"><div class="card"><small>Receita realizada</small><strong>${money(sum(done))}</strong><span>${done.length} atendimentos concluídos</span></div><div class="card"><small>Valor agendado</small><strong>${money(sum(expected))}</strong><span>${expected.length} reservas futuras/pendentes</span></div><div class="card"><small>Cancelamentos</small><strong>${subset.filter(x=>x.status==='cancelado').length}</strong><span>No período selecionado</span></div></div><div class="admin-head"><h2>Agendamentos</h2><button class="choice" onclick="adminRefresh()">Atualizar</button></div>${adminLoading?'<p class="muted">Carregando...</p>':subset.length?subset.sort((a,b)=>(a.slot_day+a.slot_time).localeCompare(b.slot_day+b.slot_time)).map(x=>`<div class="card booking"><div class="admin-head"><strong>${esc(x.customer_name)}</strong><span class="status ${x.status}">${esc(x.status)}</span></div><p>${esc(x.service)} · ${esc(x.barber)}</p><p class="muted">${x.slot_day.split('-').reverse().join('/')} às ${x.slot_time.slice(0,5)} · ${money(x.price)}</p><div class="actions"><a class="choice" target="_blank" rel="noopener" href="https://wa.me/55${encodeURIComponent(x.phone)}">WhatsApp</a>${x.status==='confirmado'?`<button class="choice" onclick="adminSet(${x.id},'concluido')">Concluir</button><button class="choice danger" onclick="adminSet(${x.id},'cancelado')">Cancelar</button>`:''}</div></div>`).join(''):'<div class="empty">Nenhum agendamento neste período.</div>'}</section>`}

function main(){if(nav==='Admin')return adminPage();if(selected)return `<section class="content"><button class="back" onclick="selected=null;render()">‹ Voltar</button>${success?`<div class="notice"><h2>✓ Agendamento registrado!</h2>${DB_ON?'Reserva registrada no sistema.':'Demonstração: configure o banco para reservar de verdade.'}</div><div class="card"><h3>${esc(selected.name)}</h3><p>${esc(barber)} • ${date.split('-').reverse().join('/')} às ${time}</p></div><button class="primary" onclick="whatsapp()">Enviar comprovante pelo WhatsApp ↗</button><button class="primary" onclick="go('Agendamentos')">Meus agendamentos</button>`:`<h1>Reserve seu horário</h1><div class="card"><b>${esc(selected.name)}</b><p class="price">${fmt(selected.price)} • ${selected.duration} min</p></div><form onsubmit="confirmBooking(event)"><label class="field">Escolha o profissional</label><div class="choices">${staff.map(s=>`<button type="button" class="choice ${barber===s?'selected':''}" onclick="barber='${s}';time='';render();if(DB_ON)loadBusy()">${s}</button>`).join('')}</div><label class="field">Selecione a data<input type="date" min="${iso(new Date())}" max="${iso(new Date(Date.now()+60*86400000))}" value="${date}" onchange="date=this.value;time='';render();if(DB_ON)loadBusy()" required></label><label class="field">Horários disponíveis</label><div class="slots">${loading?'<p class="muted">Consultando disponibilidade...</p>':slots().length?slots().map(t=>`<button type="button" class="${time===t?'selected':''}" onclick="time='${t}';render()">${t}</button>`).join(''):'<p class="muted">Nenhum horário disponível.</p>'}</div><label class="field">Seu nome<input id="customer" required placeholder="Nome completo"></label><label class="field">Telefone / WhatsApp<input id="phone" type="tel" required placeholder="(89) 99999-9999"></label><button class="primary" ${!time?'disabled':''}>Confirmar • ${fmt(selected.price)}</button></form>`}</section>`;
if(nav==='Agendamentos')return `<section class="content"><h1>Meus agendamentos</h1><p class="muted">${DB_ON?'Consulte o comprovante salvo após a reserva. Para cancelamentos, entre em contato com a barbearia.':'Somente neste navegador, para demonstração.'}</p>${bookings.length?bookings.map(x=>`<div class="card"><b>${esc(x.service)}</b><p>${x.date.split('-').reverse().join('/')} às ${x.time} • ${esc(x.barber)}</p><p>${esc(x.name)} • ${fmt(x.price)}</p><button class="choice" onclick="cancel(${x.id})" ${x.status==='cancelado'?'disabled':''}>${x.status==='cancelado'?'Cancelado':'Cancelar'}</button></div>`).join(''):'<div class="empty">Você ainda não tem agendamentos.</div>'}</section>`;
if(nav==='Perfil')return `<section class="content"><h1>Meu perfil</h1><div class="card"><h2>${icon('user')} Bem-vindo!</h2><p>Gerencie seus agendamentos e entre em contato com a barbearia.</p><button class="choice" onclick="go('Admin')">${icon('shield')} Acesso administrativo</button></div></section>`;
let results=services.map((s,i)=>({...s,i})).filter(s=>s.name.toLowerCase().includes(query.toLowerCase())).sort((a,b)=>sort==='price'?a.price-b.price:a.name.localeCompare(b.name,'pt-BR'));
return `<div class="hero"><div class="identity"><div class="logo"><img src="logo.jpg" onerror="this.remove();this.parentNode.textContent='✂'" alt="Logo da barbearia" style="width:100%;height:100%;object-fit:cover;border-radius:50%"></div><div><span class="badge">⭐ 5.0</span><h1>Barbearia Martins</h1><small>Inhuma, Piauí</small></div></div><div class="cover"><div><h2>Seu estilo começa aqui.</h2><p>Agende seu horário em poucos passos.</p></div></div></div><div class="tabs" id="tabs">${tabs.map(t=>`<button class="${tab===t?'active':''}" onclick="changeTab('${t}')">${t}</button>`).join('')}</div><section class="content"><h2>Comodidades</h2><p class="muted">Clique no item para obter informações</p><div class="amenities">${[['⌁','Wi-Fi indisponível'],['🚘','Estacionamento'],['♿','Acessibilidade não informada'],['⊘','Animais não permitidos']].map(x=>`<button onclick="alert('${x[1]}')">${x[0]}</button>`).join('')}</div><h2>${nav==='Buscar'?'Buscar serviços':tab}</h2><input class="search" placeholder="⌕  Pesquisar" value="${esc(query)}" oninput="query=this.value;updateResults()"><div id="results">${resultContent(results)}</div>${details()}</section>`}
function resultContent(results){if(tab==='Serviços'||nav==='Buscar')return `<div class="sort">Ordenar por <button class="${sort==='name'?'selected':''}" onclick="sort='name';updateResults()">Nome</button><button class="${sort==='price'?'selected':''}" onclick="sort='price';updateResults()">Valor</button></div>${results.map(s=>`<article class="service"><div class="round">${icon('scissors')}</div><div class="info"><h3>${esc(s.name)}</h3><div class="details"><span class="price">${fmt(s.price)}</span><span>◷ ${s.duration} min</span></div></div><button class="schedule" onclick="selectService(${s.i})">Agendar ${icon('arrow-right')}</button></article>`).join('')}`;
if(tab==='Profissionais')return staff.filter(s=>s.toLowerCase().includes(query.toLowerCase())).map(s=>`<div class="card staff"><div class="round">${icon('user')}</div><div><h3>${s}</h3><p class="muted">Profissional</p></div></div>`).join('');
if(tab==='Avaliações')return [['Antônio Pablo','12/09/2026',''],['Francinaldo França','30/05/2025','Atendimento top, melhor barbearia de Inhuma.'],['Arthur Borges','','']].filter(x=>x[0].toLowerCase().includes(query.toLowerCase())).map(x=>`<div class="card"><b>${x[0]}</b><p class="muted">${x[1]}</p><div class="rating">★★★★★</div><p>${x[2]}</p></div>`).join('');
return `${tab==='Fidelidade'?'<div class="choices"><span class="pill">Todos</span><span class="pill">Produtos</span><span class="pill">Serviços</span></div>':''}<div class="empty">Nenhum item encontrado</div>`}
function updateResults(){let r=services.map((s,i)=>({...s,i})).filter(s=>s.name.toLowerCase().includes(query.toLowerCase())).sort((a,b)=>sort==='price'?a.price-b.price:a.name.localeCompare(b.name,'pt-BR'));$('results').innerHTML=resultContent(r)}
function details(){return `<h2>Detalhes do estabelecimento</h2><h3>Localização</h3><p class="muted">Rua Joaquim Leal, 374 — Centro, Inhuma/PI</p><p><a style="color:#65baff" target="_blank" href="https://www.google.com/maps/search/?api=1&query=Rua+Joaquim+Leal+374+Inhuma+PI">Ver no mapa ↗</a></p><hr><h3>Horário de atendimento</h3>${['Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado','Domingo'].map((d,i)=>`<div class="line"><span>${d}</span><span>${i===6?'Fechado':i===5?'08:30 – 12:30<br>13:00 – 16:00':'08:30 – 12:00<br>14:00 – 18:00'}</span></div>`).join('')}<hr><h3>Formas de pagamento</h3>${['Dinheiro','Cartão de Crédito','Cartão de Débito','Pix'].map(x=>`<span class="pill">${x}</span>`).join('')}<hr><h3>Redes sociais</h3><div class="social-links"><a href="https://wa.me/5589994037817" target="_blank" rel="noopener">${icon('message-circle')} WhatsApp</a><a href="https://www.instagram.com/barbearia_matins/" target="_blank" rel="noopener">${icon('instagram')} Instagram</a></div><h3>Contato</h3><a style="color:#65baff" href="tel:+5589994037817">(89) 99403-7817</a></section>`}
function render(){document.body.className=light?'light':'';$('app').innerHTML=`<header><div><strong>${icon('scissors')} BARBER MARTINS</strong><small>ESTILO & TRADIÇÃO</small></div><div class="header-actions"><button class="choice" aria-label="Alternar tema" onclick="light=!light;localStorage.setItem('martins_theme',light?'light':'dark');render()">${icon(light?'moon':'sun')}</button><button class="choice admin-link" onclick="go('Admin')">${icon('shield')} Admin</button></div></header><main class="shell">${main()}</main><div class="bottom">${[['house','Início'],['search','Buscar'],['calendar','Agendamentos'],['user','Perfil']].map(([ic,n])=>`<button class="${nav===n?'current':''}" onclick="go('${n}')"><span>${icon(ic)}</span>${n}</button>`).join('')}</div>`}
render();
</script></body></html>
